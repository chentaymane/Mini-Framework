<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hdo - state and events</title>
  <style>
    body { font: 15px/1.5 sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { font: inherit; padding: 6px 14px; margin-right: 6px; }
    .count { font-size: 32px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>State and events</h1>
  <p>Click the buttons, or press <kbd>+</kbd> / <kbd>-</kbd> on the keyboard.</p>
  <div id="app"></div>

  <script src="../hdo.js"></script>
  <script>
    var h = Hdo.h;

    Hdo.setState({ count: 0 });

    function add(n) {
      Hdo.setState({ count: Hdo.getState().count + n });
    }

    // a keybinding on the whole page
    Hdo.on(document, 'keydown', function (e) {
      if (e.key === '+') add(1);
      if (e.key === '-') add(-1);
    });

    Hdo.mount(function () {
      return h('div', null, [
        h('p', { class: 'count' }, Hdo.getState().count),
        h('button', { on: { click: function () { add(-1); } } }, '-1'),
        h('button', { on: { click: function () { add(1); } } }, '+1'),
        h('button', { on: { click: function () { Hdo.setState({ count: 0 }); } } }, 'Reset')
      ]);
    }, document.getElementById('app'));
  </script>
</body>
</html>
