<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hdo - elements, attributes, events</title>
  <style>
    body { font: 15px/1.5 sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .nameSubm { display: flex; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Elements, nesting, attributes and events</h1>
  <div id="app"></div>

  <script src="../hdo.js"></script>
  <script>
    var h = Hdo.h;

    Hdo.setState({ name: '' });

    function view() {
      var name = Hdo.getState().name;

      // nested elements with attributes — the "nameSubm" example from the subject
      return h('div', null, [
        h('div', { class: 'nameSubm' }, [
          h('input', {
            type: 'text',
            placeholder: 'Insert Name',
            on: { input: function (e) { Hdo.setState({ name: e.target.value }); } }
          }),
          h('input', {
            type: 'submit',
            value: 'Clear',
            on: { click: function () { Hdo.setState({ name: '' }); } }
          })
        ]),
        h('p', null, name ? ['Hello, ', h('strong', null, name), '!'] : 'Type your name above.')
      ]);
    }

    Hdo.mount(view, document.getElementById('app'));
  </script>
</body>
</html>
