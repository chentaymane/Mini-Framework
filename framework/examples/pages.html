<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hdo - routing</title>
  <style>
    body { font: 15px/1.5 sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    nav a { margin-right: 12px; }
    nav a.active { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Routing</h1>
  <div id="app"></div>

  <script src="../hdo.js"></script>
  <script>
    var h = Hdo.h;

    Hdo.setState({ visits: 0 });
    Hdo.router(); // state.route now follows the URL: page.html#/about -> '/about'

    function link(route, label) {
      return h('a', { href: '#' + route, class: Hdo.getState().route === route ? 'active' : null }, label);
    }

    function page() {
      var route = Hdo.getState().route;
      var user = Hdo.match('/user/:id', route);

      if (route === '/') return h('p', null, 'Home page');
      if (route === '/about') return h('p', null, 'About page');
      if (user) return h('p', null, 'Profile of user #' + user.id);
      return h('p', null, 'Page not found: ' + route);
    }

    Hdo.mount(function () {
      return h('div', null, [
        h('nav', null, [link('/', 'Home'), link('/about', 'About'), link('/user/7', 'User 7')]),
        page(),
        h('button', { on: { click: function () { Hdo.navigate('/user/42'); } } }, 'Go to user 42 from code')
      ]);
    }, document.getElementById('app'));
  </script>
</body>
</html>
