<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hdo mini-framework</title>
  <style>
    body { font: 16px/1.6 sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #333; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- this page is built with Hdo too -->
  <script src="framework/hdo.js"></script>
  <script>
    var h = Hdo.h;

    function link(href, label, text) {
      return h('li', null, [h('a', { href: href }, label), ' — ' + text]);
    }

    Hdo.mount(function () {
      return h('div', null, [
        h('h1', null, 'Hdo mini-framework'),
        h('p', null, 'A small framework: virtual DOM, state, routing and events.'),
        h('ul', null, [
          link('todomvc/index.html', 'TodoMVC', 'a complete app built with Hdo'),
          link('framework/examples/hello.html', 'Hello', 'elements, nesting, attributes, events'),
          link('framework/examples/counter.html', 'Counter', 'state and keybindings'),
          link('framework/examples/pages.html', 'Pages', 'routing'),
          link('framework/README.md', 'Documentation', 'how to use the framework')
        ])
      ]);
    }, document.getElementById('app'));
  </script>
</body>
</html>
